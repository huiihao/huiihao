name: Market Pulse

on:
  schedule:
    # 09:00 UTC, 17:00 CST, after the A-share close
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Market Pulse
        run: python scripts/market_pulse.py

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/market-pulse-light.svg assets/market-pulse-dark.svg
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update market pulse"
          git push
